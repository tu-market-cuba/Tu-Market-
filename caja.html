<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#16382d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Caja Tu Market">
  <title>Caja Tu Market</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f6f7f2;color:#16382d;font-family:system-ui,-apple-system,sans-serif}header{background:#16382d;color:#fff;padding:22px 18px}header h1{margin:0;font-family:Georgia,serif}.wrap{max-width:850px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #e0e6e2;border-radius:22px;padding:20px;margin:14px 0}.status{background:#edf6d9;border-radius:10px;padding:10px;margin-bottom:14px}.offline{background:#fff3cd;color:#705600}input{width:100%;padding:15px;border:2px solid #ccd6d0;border-radius:12px;font-size:18px}button{border:0;background:#16382d;color:#fff;border-radius:11px;padding:13px 16px;font-size:16px;font-weight:800}.scan{display:grid;grid-template-columns:1fr auto;gap:10px}.cameraButton{background:#547b45;margin-top:12px;width:100%}.cameraPanel{background:#eef2ef;border-radius:14px;margin-top:12px;padding:12px}.cameraPanel h3{margin-top:0}.cameraReader{background:#111;border-radius:12px;min-height:240px;overflow:hidden}.cameraReader video{border-radius:12px}.muted{color:#6d7e76}.row{align-items:center;border-top:1px solid #e0e6e2;display:grid;gap:10px;grid-template-columns:1fr auto auto;padding:14px 0}.qty{align-items:center;display:flex;gap:8px}.qty button{padding:8px 12px}.remove{background:#a43b3b}.total{border-top:3px solid #16382d;display:flex;font-size:28px;justify-content:space-between;margin-top:18px;padding-top:18px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.secondary{background:#6d7e76}.receipt{background:#fff;color:#000;font-family:monospace;padding:10px}.receipt h3,.receipt p{text-align:center}.receiptLine{display:flex;justify-content:space-between}.hide{display:none}@media(max-width:600px){.scan,.row{grid-template-columns:1fr}.actions button{min-height:58px}}@media print{body *{visibility:hidden!important}#receiptBox,#receiptBox *{visibility:visible!important}#receiptBox{display:block!important;left:0;padding:2mm;position:fixed;top:0;width:58mm}}
  </style>
</head>
<body>
  <header><div class="wrap"><h1>🧾 Caja Tu Market</h1><div>Ventas y recibos</div></div></header>
  <main class="wrap">
    <div id="connectionStatus" class="status">Cargando productos…</div>
    <div id="receiptBox" class="receipt hide"></div>
    <section class="card">
      <h2>Escanear producto</h2>
      <p class="muted">Escanea una etiqueta TM o escribe el código y presiona Enter.</p>
      <div class="scan"><input id="scanCode" placeholder="TM000001" autocomplete="off" autofocus><button onclick="scanProduct()">Agregar</button></div>
      <button class="cameraButton" onclick="openCamera()">📷 Escanear con cámara</button>
      <div id="cameraPanel" class="cameraPanel hide"><h3>Apunta al código de barras</h3><div id="cameraReader" class="cameraReader"></div><button class="secondary" onclick="closeCamera()">Cerrar cámara</button></div>
      <p id="scanError" class="muted"></p>
    </section>
    <section class="card">
      <h2>Compra</h2>
      <div id="saleList"><p class="muted">Todavía no hay productos en la compra.</p></div>
      <div class="total"><span>Total</span><b id="saleTotal">$0.00</b></div>
      <div class="actions"><button class="secondary" onclick="clearSale()">Vaciar compra</button><button onclick="finishSale()">Cobrar e imprimir</button></div>
    </section>
  </main>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script>
    const SUPABASE_URL='https://faebaloprnuvkmqggsgo.supabase.co';
    const SUPABASE_KEY='sb_publishable_L12dqE66IVhn_qCoooGx5A_XQ2bVXRj';
    let products=[],sale=[],cameraScanner=null,cameraBusy=false;
    function productCode(id){return 'TM'+String(id).padStart(6,'0')}
    async function loadProducts(){
      try{
        const r=await fetch(`${SUPABASE_URL}/rest/v1/products?select=id,name,price,available&order=name.asc`,{headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`}});
        if(!r.ok)throw Error();
        products=await r.json();localStorage.setItem('tm-cashier-products',JSON.stringify(products));
        connectionStatus.textContent=`Caja lista · ${products.length} productos actualizados`;connectionStatus.className='status';
      }catch(e){
        products=JSON.parse(localStorage.getItem('tm-cashier-products')||'[]');
        connectionStatus.textContent=products.length?'Modo sin internet · usando productos guardados':'Conecta internet una vez para descargar los productos';connectionStatus.className='status offline';
      }
      scanCode.focus();
    }
    function findProduct(code){const match=code.trim().toUpperCase().match(/^TM0*(\d+)$/);return match?products.find(v=>Number(v.id)===Number(match[1])&&v.available!==false):null}
    function scanProduct(){const code=scanCode.value.trim(),product=findProduct(code);scanError.textContent='';if(!code)return;if(!product){scanError.textContent='Código no encontrado o producto no disponible.';scanCode.select();return}const item=sale.find(v=>v.id===product.id);if(item)item.qty++;else sale.push({...product,qty:1});scanCode.value='';renderSale();scanCode.focus()}
    async function openCamera(){if(cameraBusy)return;scanError.textContent='';if(typeof Html5Qrcode==='undefined'){scanError.textContent='Conecta internet una vez para preparar el escáner de cámara.';return}cameraBusy=true;cameraPanel.classList.remove('hide');cameraScanner=new Html5Qrcode('cameraReader');try{const formats=[Html5QrcodeSupportedFormats.CODE_128,Html5QrcodeSupportedFormats.EAN_13,Html5QrcodeSupportedFormats.EAN_8,Html5QrcodeSupportedFormats.UPC_A,Html5QrcodeSupportedFormats.UPC_E];await cameraScanner.start({facingMode:'environment'},{fps:10,qrbox:{width:280,height:150},formatsToSupport:formats},async decoded=>{if(!cameraBusy)return;scanCode.value=decoded;scanProduct();await closeCamera()},()=>{})}catch(e){scanError.textContent='No se pudo abrir la cámara. Permite el acceso a la cámara en Safari.';cameraPanel.classList.add('hide');cameraScanner=null;cameraBusy=false}}
    async function closeCamera(){if(cameraScanner){try{await cameraScanner.stop()}catch(e){}try{cameraScanner.clear()}catch(e){}}cameraScanner=null;cameraBusy=false;cameraPanel.classList.add('hide');scanCode.focus()}
    function changeQty(id,amount){const item=sale.find(v=>v.id===id);if(!item)return;item.qty+=amount;if(item.qty<=0)sale=sale.filter(v=>v.id!==id);renderSale()}
    function removeItem(id){sale=sale.filter(v=>v.id!==id);renderSale()}
    function renderSale(){saleList.innerHTML=sale.length?'':'<p class="muted">Todavía no hay productos en la compra.</p>';let total=0;sale.forEach(v=>{total+=Number(v.price||0)*v.qty;saleList.insertAdjacentHTML('beforeend',`<div class="row"><span><b>${v.name}</b><br><small>${productCode(v.id)} · $${Number(v.price||0).toFixed(2)} c/u</small></span><div class="qty"><button onclick="changeQty(${v.id},-1)">−</button><b>${v.qty}</b><button onclick="changeQty(${v.id},1)">+</button></div><div><b>$${(Number(v.price||0)*v.qty).toFixed(2)}</b> <button class="remove" onclick="removeItem(${v.id})">Eliminar</button></div></div>`)});saleTotal.textContent='$'+total.toFixed(2)}
    function clearSale(){if(sale.length&&!confirm('¿Vaciar todos los productos de esta compra?'))return;sale=[];renderSale();scanCode.focus()}
    function finishSale(){if(!sale.length)return alert('Escanea al menos un producto.');const total=sale.reduce((sum,v)=>sum+Number(v.price||0)*v.qty,0),date=new Date(),receipt={id:'V'+Date.now(),date:date.toISOString(),items:sale.map(v=>({id:v.id,name:v.name,price:Number(v.price||0),qty:v.qty})),total};const saved=JSON.parse(localStorage.getItem('tm-offline-sales')||'[]');saved.unshift(receipt);localStorage.setItem('tm-offline-sales',JSON.stringify(saved.slice(0,500)));receiptBox.innerHTML=`<h3>Tu Market</h3><p>${date.toLocaleString('es-CU')}</p>${sale.map(v=>`<div>${v.qty} × ${v.name}</div><div class="receiptLine"><span>$${Number(v.price||0).toFixed(2)} c/u</span><b>$${(Number(v.price||0)*v.qty).toFixed(2)}</b></div>`).join('')}<hr><div class="receiptLine"><b>TOTAL</b><b>$${total.toFixed(2)}</b></div><p>Gracias por su compra</p>`;receiptBox.classList.remove('hide');window.print();sale=[];renderSale();scanCode.focus()}
    scanCode.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();scanProduct()}});
    window.addEventListener('online',loadProducts);window.addEventListener('offline',()=>{connectionStatus.textContent='Modo sin internet · usando productos guardados';connectionStatus.className='status offline'});
    if('serviceWorker'in navigator)navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
    loadProducts();
  </script>
</body>
</html>
