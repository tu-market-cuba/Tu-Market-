<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#16382d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Caja Tu Market">
  <title>Caja Tu Market</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f6f7f2;color:#16382d;font-family:system-ui,-apple-system,sans-serif}header{background:#16382d;color:#fff;padding:22px 18px}header h1{margin:0;font-family:Georgia,serif}.wrap{max-width:850px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #e0e6e2;border-radius:22px;padding:20px;margin:14px 0}.loginCard{max-width:460px;margin:7vh auto}.status{background:#edf6d9;border-radius:10px;padding:10px;margin-bottom:14px}.offline{background:#fff3cd;color:#705600}input,select{width:100%;padding:15px;border:2px solid #ccd6d0;border-radius:12px;font-size:18px;margin:5px 0 12px}button{border:0;background:#16382d;color:#fff;border-radius:11px;padding:13px 16px;font-size:16px;font-weight:800}.scan{display:grid;grid-template-columns:1fr auto;gap:10px}.muted{color:#6d7e76}.cashierBar{align-items:center;background:#edf6d9;border-radius:12px;display:flex;justify-content:space-between;margin-bottom:14px;padding:11px 14px}.cashierBar button{padding:8px 11px}.row{align-items:center;border-top:1px solid #e0e6e2;display:grid;gap:10px;grid-template-columns:1fr auto auto;padding:14px 0}.qty{align-items:center;display:flex;gap:8px}.qty button{padding:8px 12px}.remove{background:#a43b3b}.total{border-top:3px solid #16382d;display:flex;font-size:28px;justify-content:space-between;margin-top:18px;padding-top:18px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.secondary{background:#6d7e76}.receipt{background:#fff;color:#000;font-family:monospace;padding:10px}.receipt h3,.receipt p{text-align:center}.receiptLine{display:flex;justify-content:space-between}.hide{display:none}@media(max-width:600px){.scan,.row{grid-template-columns:1fr}.actions button{min-height:58px}}@media print{body *{visibility:hidden!important}#receiptBox,#receiptBox *{visibility:visible!important}#receiptBox{display:block!important;left:0;padding:2mm;position:fixed;top:0;width:58mm}}
  </style>
</head>
<body>
  <header><div class="wrap"><h1>🧾 Caja Tu Market</h1><div>Ventas y recibos</div></div></header>
  <main class="wrap">
    <section id="cashierLogin" class="card loginCard">
      <h2>Iniciar turno</h2>
      <p class="muted">Selecciona tu nombre y escribe tu contraseña para comenzar a vender.</p>
      <label>Dependiente</label><select id="cashierSelect"></select>
      <label>Contraseña</label><input id="cashierPassword" type="password" inputmode="numeric" autocomplete="current-password">
      <button style="width:100%" onclick="cashierEnter()">Entrar a la caja</button>
      <p id="cashierError" class="muted"></p>
    </section>
    <div id="cashierApp" class="hide">
    <div class="cashierBar"><span>Dependiente: <b id="cashierName"></b></span><button class="secondary" onclick="cashierLogout()">Cerrar turno</button></div>
    <div id="connectionStatus" class="status">Cargando productos…</div>
    <div id="receiptBox" class="receipt hide"></div>
    <section class="card">
      <h2>Escanear producto</h2>
      <p class="muted">Escanea una etiqueta TM o escribe el código y presiona Enter.</p>
      <div class="scan"><input id="scanCode" placeholder="TM000001" autocomplete="off" autofocus><button onclick="scanProduct()">Agregar</button></div>
      <p id="scanError" class="muted"></p>
    </section>
    <section class="card">
      <h2>Compra</h2>
      <div id="saleList"><p class="muted">Todavía no hay productos en la compra.</p></div>
      <div class="total"><span>Total</span><b id="saleTotal">$0.00</b></div>
      <div class="actions"><button class="secondary" onclick="clearSale()">Vaciar compra</button><button onclick="finishSale()">Cobrar e imprimir</button></div>
    </section>
    </div>
  </main>
  <script>
    const SUPABASE_URL='https://faebaloprnuvkmqggsgo.supabase.co';
    const SUPABASE_KEY='sb_publishable_L12dqE66IVhn_qCoooGx5A_XQ2bVXRj';
    let products=[],sale=[],currentCashier=null;
    const encoder=new TextEncoder();
    async function hashPassword(value,salt){const data=encoder.encode(`${salt}:${value}`),digest=await crypto.subtle.digest('SHA-256',data);return [...new Uint8Array(digest)].map(v=>v.toString(16).padStart(2,'0')).join('')}
    function cashiers(){return JSON.parse(localStorage.getItem('tm-cashiers')||'[]').filter(v=>v.active!==false)}
    function loadCashiers(){const staff=cashiers();cashierSelect.innerHTML=staff.length?staff.map(v=>`<option value="${v.id}">${v.name}</option>`).join(''):'<option value="">No hay dependientes registrados</option>';cashierPassword.disabled=!staff.length;cashierLogin.querySelector('button').disabled=!staff.length;cashierError.textContent=staff.length?'':'El jefe debe agregar dependientes desde el panel administrativo en esta tableta.'}
    async function cashierEnter(){const worker=cashiers().find(v=>v.id===cashierSelect.value);if(!worker)return;const hash=await hashPassword(cashierPassword.value,worker.salt);if(hash!==worker.passwordHash){cashierError.textContent='Contraseña incorrecta.';cashierPassword.select();return}currentCashier={id:worker.id,name:worker.name};sessionStorage.setItem('tm-current-cashier',JSON.stringify(currentCashier));cashierPassword.value='';showCashierApp()}
    function showCashierApp(){cashierLogin.classList.add('hide');cashierApp.classList.remove('hide');cashierName.textContent=currentCashier.name;loadProducts()}
    function cashierLogout(){if(sale.length&&!confirm('Hay productos sin cobrar. ¿Cerrar el turno y vaciar la compra?'))return;sale=[];sessionStorage.removeItem('tm-current-cashier');currentCashier=null;cashierApp.classList.add('hide');cashierLogin.classList.remove('hide');loadCashiers();cashierPassword.focus()}
    function productCode(id){return 'TM'+String(id).padStart(6,'0')}
    async function loadProducts(){
      try{
        const r=await fetch(`${SUPABASE_URL}/rest/v1/products?select=id,name,price,available&order=name.asc`,{headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`}});
        if(!r.ok)throw Error();
        products=await r.json();localStorage.setItem('tm-cashier-products',JSON.stringify(products));
        connectionStatus.textContent=`Caja lista · ${products.length} productos actualizados`;connectionStatus.className='status';
      }catch(e){
        products=JSON.parse(localStorage.getItem('tm-cashier-products')||'[]');
        connectionStatus.textContent=products.length?'Modo sin internet · usando productos guardados':'Conecta internet una vez para descargar los productos';connectionStatus.className='status offline';
      }
      scanCode.focus();
    }
    function findProduct(code){const match=code.trim().toUpperCase().match(/^TM0*(\d+)$/);return match?products.find(v=>Number(v.id)===Number(match[1])&&v.available!==false):null}
    function scanProduct(){const code=scanCode.value.trim(),product=findProduct(code);scanError.textContent='';if(!code)return;if(!product){scanError.textContent='Código no encontrado o producto no disponible.';scanCode.select();return}const item=sale.find(v=>v.id===product.id);if(item)item.qty++;else sale.push({...product,qty:1});scanCode.value='';renderSale();scanCode.focus()}
    function changeQty(id,amount){const item=sale.find(v=>v.id===id);if(!item)return;item.qty+=amount;if(item.qty<=0)sale=sale.filter(v=>v.id!==id);renderSale()}
    function removeItem(id){sale=sale.filter(v=>v.id!==id);renderSale()}
    function renderSale(){saleList.innerHTML=sale.length?'':'<p class="muted">Todavía no hay productos en la compra.</p>';let total=0;sale.forEach(v=>{total+=Number(v.price||0)*v.qty;saleList.insertAdjacentHTML('beforeend',`<div class="row"><span><b>${v.name}</b><br><small>${productCode(v.id)} · $${Number(v.price||0).toFixed(2)} c/u</small></span><div class="qty"><button onclick="changeQty(${v.id},-1)">−</button><b>${v.qty}</b><button onclick="changeQty(${v.id},1)">+</button></div><div><b>$${(Number(v.price||0)*v.qty).toFixed(2)}</b> <button class="remove" onclick="removeItem(${v.id})">Eliminar</button></div></div>`)});saleTotal.textContent='$'+total.toFixed(2)}
    function clearSale(){if(sale.length&&!confirm('¿Vaciar todos los productos de esta compra?'))return;sale=[];renderSale();scanCode.focus()}
    function finishSale(){if(!currentCashier)return cashierLogout();if(!sale.length)return alert('Escanea al menos un producto.');const total=sale.reduce((sum,v)=>sum+Number(v.price||0)*v.qty,0),date=new Date(),receipt={id:'V'+Date.now(),date:date.toISOString(),cashierId:currentCashier.id,cashierName:currentCashier.name,items:sale.map(v=>({id:v.id,name:v.name,price:Number(v.price||0),qty:v.qty})),total};const saved=JSON.parse(localStorage.getItem('tm-offline-sales')||'[]');saved.unshift(receipt);localStorage.setItem('tm-offline-sales',JSON.stringify(saved.slice(0,500)));receiptBox.innerHTML=`<h3>Tu Market</h3><p>${date.toLocaleString('es-CU')}</p><p>Dependiente: ${currentCashier.name}</p>${sale.map(v=>`<div>${v.qty} × ${v.name}</div><div class="receiptLine"><span>$${Number(v.price||0).toFixed(2)} c/u</span><b>$${(Number(v.price||0)*v.qty).toFixed(2)}</b></div>`).join('')}<hr><div class="receiptLine"><b>TOTAL</b><b>$${total.toFixed(2)}</b></div><p>Gracias por su compra</p>`;receiptBox.classList.remove('hide');window.print();sale=[];renderSale();scanCode.focus()}
    scanCode.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();scanProduct()}});
    window.addEventListener('online',loadProducts);window.addEventListener('offline',()=>{connectionStatus.textContent='Modo sin internet · usando productos guardados';connectionStatus.className='status offline'});
    if('serviceWorker'in navigator)navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
    loadCashiers();try{currentCashier=JSON.parse(sessionStorage.getItem('tm-current-cashier')||'null')}catch(e){}if(currentCashier&&cashiers().some(v=>v.id===currentCashier.id))showCashierApp();
  </script>
</body>
</html>
