<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#16382d"><title>Panel Tu Market</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f6f7f2;color:#16382d;font-family:system-ui}header{background:#16382d;color:#fff;padding:20px}.wrap{max-width:950px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #e0e6e2;border-radius:20px;padding:20px;margin:14px 0}h1,h2{font-family:Georgia,serif}input,select{width:100%;padding:11px;border:1px solid #ccd6d0;border-radius:10px;margin:5px 0 10px}button{border:0;background:#16382d;color:#fff;border-radius:10px;padding:11px 15px;font-weight:800;cursor:pointer}.row{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.item,.order{border-top:1px solid #e0e6e2;padding:14px 0}.item{display:flex;justify-content:space-between;gap:12px}.actions{display:flex;gap:8px;align-items:center}.red{background:#a43b3b}.hide{display:none}.login{max-width:430px;margin:8vh auto}.muted{color:#6d7e76;font-size:13px}.message{background:#edf6d9;padding:10px;border-radius:10px}.order select{max-width:190px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px}@media(max-width:650px){.row{grid-template-columns:1fr}.top,.item{align-items:stretch;flex-direction:column}.actions button{flex:1}}</style></head>
<body><header><div class="wrap"><a style="color:white" href="index.html">← Tienda</a><h1>Panel administrativo</h1></div></header><main class="wrap">
<section id="login" class="card login"><h2>Acceso administrativo</h2><p class="muted">Usa el correo y la contraseña del administrador creados en Supabase.</p><label>Correo electrónico</label><input id="email" type="email" autocomplete="username"><label>Contraseña</label><input id="password" type="password" autocomplete="current-password"><button id="loginButton" onclick="enter()">Entrar</button><p id="loginError" class="muted"></p></section>
<section id="panel" class="hide"><div class="top"><h2>Tu Market</h2><button onclick="logout()">Cerrar sesión</button></div><p id="message" class="message hide"></p>
<div class="card"><h2>Agregar producto</h2><div class="row"><input id="n" placeholder="Nombre"><select id="c"><option>Aseo</option><option>Bebidas y licorería</option><option>Cárnicos</option><option>Aseo personal</option><option>Equipos eléctricos</option><option>Dulces</option><option>Agricultura</option></select><input id="p" type="number" step="0.01" placeholder="Precio"><input id="u" placeholder="Unidad (unidad, libra, paquete…)"><input id="e" placeholder="Emoji 🛒"><input id="img" type="url" placeholder="Enlace de la foto (opcional)"><select id="a"><option value="true">Disponible</option><option value="false">No disponible</option></select></div><button onclick="addProduct()">Guardar producto</button></div>
<div class="card"><h2>Productos</h2><div id="list"><p class="muted">Cargando…</p></div></div><div class="card"><h2>Pedidos</h2><div id="orders"><p class="muted">Cargando…</p></div></div></section></main>
<script>
const SUPABASE_URL='https://faebaloprnuvkmqggsgo.supabase.co',SUPABASE_KEY='sb_publishable_L12dqE66IVhn_qCoooGx5A_XQ2bVXRj';let token=sessionStorage.getItem('tm-admin-token')||'';
function headers(extra={}){return{apikey:SUPABASE_KEY,Authorization:`Bearer ${token||SUPABASE_KEY}`,...extra}}
function notice(text){message.textContent=text;message.classList.remove('hide');setTimeout(()=>message.classList.add('hide'),3500)}
async function enter(){loginButton.disabled=true;loginError.textContent='Entrando…';try{const r=await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`,{method:'POST',headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({email:email.value.trim(),password:password.value})});const data=await r.json();if(!r.ok)throw Error();token=data.access_token;sessionStorage.setItem('tm-admin-token',token);show()}catch(e){loginError.textContent='No se pudo entrar. Revisa el correo y la contraseña.'}finally{loginButton.disabled=false}}
function show(){login.classList.add('hide');panel.classList.remove('hide');loadProducts();loadOrders()}
function logout(){sessionStorage.removeItem('tm-admin-token');location.reload()}
async function api(table,options=''){const r=await fetch(`${SUPABASE_URL}/rest/v1/${table}${options}`,{headers:headers()});if(r.status===401){logout();throw Error()}if(!r.ok)throw Error(await r.text());return r.json()}
async function loadProducts(){try{const data=await api('products','?select=*&order=name.asc');list.innerHTML=data.length?'':'<p class="muted">Todavía no hay productos.</p>';data.forEach(v=>list.insertAdjacentHTML('beforeend',`<div class="item"><span><b>${v.emoji||'🛒'} ${v.name}</b><br><small>${v.category} · ${Number(v.price)>0?'$'+Number(v.price).toFixed(2):'Precio por confirmar'} · ${v.available?'Disponible':'No disponible'}</small></span><div class="actions"><button onclick="toggleProduct(${v.id},${!v.available})">${v.available?'Agotar':'Activar'}</button><button class="red" onclick="delProduct(${v.id})">Eliminar</button></div></div>`))}catch(e){list.innerHTML='<p class="muted">No se pudieron cargar los productos.</p>'}}
async function addProduct(){if(!n.value.trim())return alert('Escribe el nombre.');const body={name:n.value.trim(),category:c.value,price:Number(p.value||0),unit:u.value.trim()||'unidad',emoji:e.value.trim()||'🛒',available:a.value==='true',image_url:img.value.trim()||null};const r=await fetch(`${SUPABASE_URL}/rest/v1/products`,{method:'POST',headers:headers({'Content-Type':'application/json',Prefer:'return=minimal'}),body:JSON.stringify(body)});if(!r.ok)return alert('No se pudo guardar el producto.');n.value=p.value=u.value=e.value=img.value='';notice('Producto guardado.');loadProducts()}
async function toggleProduct(id,available){const r=await fetch(`${SUPABASE_URL}/rest/v1/products?id=eq.${id}`,{method:'PATCH',headers:headers({'Content-Type':'application/json',Prefer:'return=minimal'}),body:JSON.stringify({available})});if(r.ok)loadProducts();else alert('No se pudo cambiar el producto.')}
async function delProduct(id){if(!confirm('¿Eliminar este producto?'))return;const r=await fetch(`${SUPABASE_URL}/rest/v1/products?id=eq.${id}`,{method:'DELETE',headers:headers({Prefer:'return=minimal'})});if(r.ok)loadProducts();else alert('No se pudo eliminar.')}
async function loadOrders(){try{const data=await api('orders','?select=*&order=created_at.desc');orders.innerHTML=data.length?'':'<p class="muted">Todavía no hay pedidos.</p>';data.forEach(o=>orders.insertAdjacentHTML('beforeend',`<div class="order"><b>${o.confirmation_code}</b> · ${o.customer_name}<br><small>${o.phone} · ${o.delivery_type} · ${o.payment_method}</small><br><small>${o.address||''}${o.reference?' · Referencia: '+o.reference:''}</small><p>${(o.items||[]).map(i=>i.name).join(', ')||'Sin productos'} · Total: $${Number(o.total||0).toFixed(2)}</p><select onchange="changeStatus('${o.id}',this.value)">${['Pendiente','Confirmado','Entregado','Cancelado'].map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select></div>`))}catch(e){orders.innerHTML='<p class="muted">No se pudieron cargar los pedidos.</p>'}}
async function changeStatus(id,status){const r=await fetch(`${SUPABASE_URL}/rest/v1/orders?id=eq.${id}`,{method:'PATCH',headers:headers({'Content-Type':'application/json',Prefer:'return=minimal'}),body:JSON.stringify({status})});if(r.ok)notice('Estado actualizado.');else alert('No se pudo actualizar el pedido.')}
if(token)show();
</script></body></html>
